# Servicios opcionales de la HMI.
#   docker compose up -d mosquitto     # broker MQTT en el puerto 1883
# Sin Docker (macOS con Homebrew):  mosquitto -c hmi/mosquitto/mosquitto-local.conf
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: balancin-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-data:
