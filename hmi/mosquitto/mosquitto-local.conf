# Broker MQTT del laboratorio (F5). Uso local en la red del laboratorio: sin usuarios.
# No exponer a internet así: para un despliegue público, agregar usuarios (password_file)
# y TLS.
listener 1883 0.0.0.0
allow_anonymous true

# Guarda los mensajes retenidos (estado online/offline de cada robot) entre reinicios
persistence false
# (nativo: sin persistencia)

log_dest stdout
log_type error
log_type warning
log_type notice
