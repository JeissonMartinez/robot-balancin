[env:esp32-s3-devkitm-1]
; Plataforma oficial fija: el firmware usa el ESP-IDF 4.4 (Arduino 2.0.17). Sin versión,
; "espressif32" puede resolver a pioarduino (Arduino 3 / IDF 5), que no compila mqtt_link.cpp.
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 921600  ; = SERIAL_BAUD en config.h

; Neural_Networks_FF y Dynamic_Array son librerías locales en lib/
lib_deps = 
    jrowberg/i2cdevlib-MPU6050
    bblanchon/ArduinoJson@^7.2.0
    esp32async/ESPAsyncWebServer@^3.12.1

lib_ignore = 
    RPAsyncTCP

lib_ldf_mode = deep+

build_unflags = -Werror
